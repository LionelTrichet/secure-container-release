name: Release

on:
  push:
    tags:
      - 'v0.1.0'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  BUILDX_NO_DEFAULT_ATTESTATIONS: '1'

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Validate release source
        run: |
          set -euo pipefail
          . build/versions.env

          if [ "${GITHUB_REF}" != "refs/tags/v0.1.0" ] || [ "${GITHUB_REF_NAME}" != "v0.1.0" ]; then
            printf 'FAIL: only refs/tags/v0.1.0 is authorized, got %s\n' "${GITHUB_REF}"
            exit 1
          fi

          ref_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [ "${ref_type}" != "commit" ]; then
            printf 'FAIL: %s is a %s object; the release tag must be lightweight\n' "${GITHUB_REF_NAME}" "${ref_type}"
            exit 1
          fi

          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          TAG_SHA="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")"
          if [ "${TAG_SHA}" != "${MAIN_SHA}" ]; then
            printf 'FAIL: tag %s points to %s, main is %s\n' "${GITHUB_REF_NAME}" "${TAG_SHA}" "${MAIN_SHA}"
            exit 1
          fi
          if ! printf '%s' "${TAG_SHA}" | grep -Eq '^[a-f0-9]{40}$'; then
            printf 'FAIL: tag commit %s is not a 40-character SHA\n' "${TAG_SHA}"
            exit 1
          fi

          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${RELEASE_VERSION}" != "${APP_VERSION}" ]; then
            printf 'FAIL: tag version %s does not match APP_VERSION %s\n' "${RELEASE_VERSION}" "${APP_VERSION}"
            exit 1
          fi

          BUILT_AT="$(git show -s --format=%cI "${TAG_SHA}")"
          SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY}"
          IMAGE_REPOSITORY="$(printf '%s' "${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${GITHUB_REF_NAME}"

          {
            printf 'TAG_SHA=%s\n' "${TAG_SHA}"
            printf 'RELEASE_VERSION=%s\n' "${RELEASE_VERSION}"
            printf 'BUILT_AT=%s\n' "${BUILT_AT}"
            printf 'SOURCE_URL=%s\n' "${SOURCE_URL}"
            printf 'IMAGE_REPOSITORY=%s\n' "${IMAGE_REPOSITORY}"
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}"
            printf 'COSIGN_IDENTITY=%s\n' "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          } >> "${GITHUB_ENV}"
          printf 'Release %s from %s\n' "${GITHUB_REF_NAME}" "${TAG_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.33.0-ubuntu@sha256:f9f89565e1a4e0a5f395b2bff4e7ebf07b753a82c7c7e1ea75472c8556937e83

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Assert Cosign version
        run: |
          set -euo pipefail
          cosign version 2>&1 | grep -F 'v3.1.3'

      - name: Install Trivy and Syft
        run: scripts/install-ci-tools.sh

      - name: Tool versions
        run: |
          docker version
          docker buildx version
          gh --version
          go version

      - name: make check
        run: make check

      - name: Build release image once
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            --build-arg "VERSION=${RELEASE_VERSION}" \
            --build-arg "COMMIT=${TAG_SHA}" \
            --build-arg "BUILT_AT=${BUILT_AT}" \
            --build-arg "SOURCE_URL=${SOURCE_URL}" \
            --tag "${IMAGE_TAG}" \
            .
          LOCAL_IMAGE_ID="$(docker image inspect "${IMAGE_TAG}" --format '{{.Id}}')"
          printf '%s' "${LOCAL_IMAGE_ID}" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf 'LOCAL_IMAGE_ID=%s\n' "${LOCAL_IMAGE_ID}" >> "${GITHUB_ENV}"
          printf 'Local image ID %s\n' "${LOCAL_IMAGE_ID}"

      - name: Verify local release image
        run: scripts/verify-image.sh "${IMAGE_TAG}" "${RELEASE_VERSION}" "${TAG_SHA}" "${BUILT_AT}" "${SOURCE_URL}"

      - name: Vulnerability gate
        run: scripts/scan-image.sh "${IMAGE_TAG}"

      - name: Generate SBOM
        run: scripts/generate-sbom.sh "${IMAGE_TAG}" dist/sbom.spdx.json

      - name: Verify SBOM
        run: scripts/verify-sbom.sh dist/sbom.spdx.json

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        run: docker push "${IMAGE_TAG}"

      - name: Capture registry digest
        run: |
          set -euo pipefail
          REPO_DIGEST="$(docker image inspect "${IMAGE_TAG}" --format '{{index .RepoDigests 0}}')"
          printf '%s' "${REPO_DIGEST}" | grep -Eq "^${IMAGE_REPOSITORY}@sha256:[a-f0-9]{64}\$"
          IMAGE_DIGEST="${REPO_DIGEST#*@}"
          printf '%s' "${IMAGE_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'
          {
            printf 'IMAGE_DIGEST_REF=%s\n' "${REPO_DIGEST}"
            printf 'IMAGE_DIGEST=%s\n' "${IMAGE_DIGEST}"
          } >> "${GITHUB_ENV}"
          printf 'Published %s\n' "${REPO_DIGEST}"

      - name: Pull by digest and compare with the tested image
        run: |
          set -euo pipefail
          docker image rm "${IMAGE_TAG}"
          if docker image inspect "${IMAGE_DIGEST_REF}" >/dev/null 2>&1; then
            printf 'FAIL: image is still present locally; pull verification would be meaningless\n'
            exit 1
          fi
          docker pull "${IMAGE_DIGEST_REF}"
          REMOTE_IMAGE_ID="$(docker image inspect "${IMAGE_DIGEST_REF}" --format '{{.Id}}')"
          if [ "${REMOTE_IMAGE_ID}" != "${LOCAL_IMAGE_ID}" ]; then
            printf 'FAIL: remote image ID %s differs from tested local image ID %s\n' "${REMOTE_IMAGE_ID}" "${LOCAL_IMAGE_ID}"
            exit 1
          fi
          printf 'Remote image ID matches the tested image: %s\n' "${REMOTE_IMAGE_ID}"

      - name: Verify published runtime
        run: scripts/verify-image.sh "${IMAGE_DIGEST_REF}" "${RELEASE_VERSION}" "${TAG_SHA}" "${BUILT_AT}" "${SOURCE_URL}"

      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
          create-storage-record: false

      - id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: dist/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Sign digest with Sigstore keyless signing
        run: cosign sign --yes "${IMAGE_DIGEST_REF}"

      - name: Verify signature identity
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref "${GITHUB_REF}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-github-workflow-trigger "push" \
            "${IMAGE_DIGEST_REF}" >/dev/null
          printf 'Signature verified for %s\n' "${COSIGN_IDENTITY}"

      - name: Verify provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${IMAGE_DIGEST_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners

      - name: Verify SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${IMAGE_DIGEST_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --deny-self-hosted-runners

      - name: Failure diagnostics
        if: failure()
        run: |
          set +e
          printf 'ref: %s\n' "${GITHUB_REF}"
          printf 'tag commit: %s\n' "${TAG_SHA:-<unset>}"
          printf 'image repository: %s\n' "${IMAGE_REPOSITORY:-<unset>}"
          printf 'image digest: %s\n' "${IMAGE_DIGEST:-<not published>}"
          docker version --format '{{.Client.Version}} / {{.Server.Version}}'
          docker buildx version
          trivy --version
          syft version
          cosign version
          gh --version
          go version
